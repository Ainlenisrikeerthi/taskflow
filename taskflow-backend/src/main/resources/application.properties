spring.config.import=optional:file:.env[.properties]

server.port=${PORT:8080}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

spring.mail.host=${EMAIL_HOST:smtp.gmail.com}
spring.mail.port=${EMAIL_PORT:587}
spring.mail.username=${EMAIL_USERNAME}
spring.mail.password=${EMAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Local Java code runner for controlled development/demo use.
# Requires a JDK (both java and javac must be available).
code.local.java-command=${LOCAL_JAVA_COMMAND:java}
code.local.javac-command=${LOCAL_JAVAC_COMMAND:javac}
code.local.compile-timeout-seconds=${LOCAL_COMPILE_TIMEOUT_SECONDS:10}
code.local.run-timeout-seconds=${LOCAL_RUN_TIMEOUT_SECONDS:5}
code.local.max-output-chars=${LOCAL_MAX_OUTPUT_CHARS:20000}

# Optional real AI generation/analysis through OpenRouter.
# Change models in .env without changing Java code.
ai.openrouter.api-key=${OPENROUTER_API_KEY:}
ai.openrouter.primary-model=${OPENROUTER_PRIMARY_MODEL:}
ai.openrouter.fallback-model=${OPENROUTER_FALLBACK_MODEL:}
ai.openrouter.site-url=${OPENROUTER_SITE_URL:}
ai.openrouter.app-name=${OPENROUTER_APP_NAME:TaskFlow}
